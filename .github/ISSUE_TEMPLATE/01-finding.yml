name: "🐞 [PRIVATE MIRROR ONLY] Finding — confirmed vulnerability"
description: "Use ONLY on the private evidence repository of an engagement (SANE_EVIDENCE_REMOTE). Never on the public methodology repo. findings/F-NNN/report.md is the record of truth; read docs/02 first."
title: "[FINDING] <impact-category title, never the Android mechanism>"
labels: ["type: finding"]
projects: ["sanehunters/1"]
body:
  - type: markdown
    attributes:
      value: |
        **PRIVATE MIRROR ONLY.** This form carries undisclosed vulnerability details (package, file:line mechanism,
        reproduction, canary). Open it only on the engagement's private evidence repository, never on the public
        methodology repository. The record of truth stays `findings/F-NNN/report.md`.
  - type: markdown
    attributes:
      value: |
        Title = the impact. Good: `Account takeover via OAuth code interception in the exported callback activity`.
        Bad: `Activity com.target.AuthCallbackActivity is exported`.
        A P5-only VRT path is not a finding on its own: chain it, or file a Ruled-out instead.
        This form is advisory for the web UI; the contract is `templates/finding-report.md` + `START.md` §6.

  - type: input
    id: finding_id
    attributes: {label: Finding id, description: "F-NNN as assigned in findings-index.md", placeholder: F-003}
    validations: {required: true}
  - type: input
    id: engagement
    attributes: {label: Engagement folder, placeholder: BugBountyTarget/<Target>_<DDMMYYYY>}
    validations: {required: true}
  - type: input
    id: checklist_ids
    attributes: {label: Checklist item id(s), description: "Dnn-NNN; the hypothesis H-NNN and instance C-/U-/W-/E-NNN if any", placeholder: "D07-014; H-004; C-023"}
    validations: {required: true}
  - type: input
    id: target
    attributes: {label: Target build, description: "package · versionName (versionCode) · targetSdk · build fingerprint · security patch", placeholder: "com.client.app 8.42.1 (84201) · targetSdk 34 · google/sdk_gphone64_x86_64/… · 2026-09-05"}
    validations: {required: true}
  - type: dropdown
    id: device
    attributes:
      label: Device the proof ran on
      options: ["Rooted userdebug AVD", "Stock physical device (non-rooted)", "Both", "Static only — not executed (say so in Limitations)"]
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Critical (VRT P1)", "High (VRT P2)", "Medium (VRT P3)", "Low (VRT P4)", "Informational (VRT P5) — withheld, filed for the record"]
    validations: {required: true}
  - type: input
    id: vrt
    attributes: {label: VRT path, description: "Exact path from data/vrt.csv; must not be a P5 leaf or a parent node", placeholder: broken_access_control.idor.modify_view_sensitive_information_iterable_object_identifiers}
    validations: {required: true}
  - type: dropdown
    id: attacker
    attributes:
      label: Attacker model (the weakest that still works — docs/05)
      options:
        - "AM-01 remote, no interaction"
        - "AM-02 remote, one click"
        - "AM-03 zero-permission local app"
        - "AM-04 local app with one common permission"
        - "AM-05 another user of the same app"
        - "AM-06 network attacker, no trusted CA"
        - "AM-07 network attacker with a trusted CA"
        - "AM-08 malicious third-party SDK"
        - "AM-09 malicious backend or CDN"
        - "AM-10 physical access, locked"
        - "AM-11 physical access, unlocked"
    validations: {required: true}
  - type: textarea
    id: precondition
    attributes: {label: Precondition, description: "One sentence, as weak as you can honestly make it. This drives the rating.", placeholder: "Any application installed on the device, declaring no permissions, can …"}
    validations: {required: true}
  - type: textarea
    id: mechanism
    attributes:
      label: Mechanism — the control that should have stopped this, and the path that skips it
      description: Cite file:line for both. Explain WHY the control fails.
      placeholder: |
        Guard: RouterActivity.java:88 allow-lists three hosts before startActivity().
        Path that skips it: RouterActivity.java:140 (onNewIntent) reaches the same sink without validate().
        Why: …
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Reproduction, description: "Numbered, copy-pasteable, no placeholders. From the probe app or a link, not from adb.", render: shell}
    validations: {required: true}
  - type: textarea
    id: delta
    attributes: {label: The delta, description: "Authorised access vs access obtained, with the canary value.", placeholder: "Authorised: 1 contact. Obtained: all 3 incl. canary CANARY-7f3a… never shown to the picker."}
    validations: {required: true}
  - type: input
    id: canary
    attributes: {label: Canary value planted, placeholder: "CANARY-7f3a91 in shared_prefs/session.xml"}
    validations: {required: true}
  - type: textarea
    id: negative_control
    attributes: {label: Negative control, description: "What the attacker could NOT do before the exploit, shown in the same take, and how the state was made clean."}
    validations: {required: true}
  - type: textarea
    id: chain
    attributes:
      label: Chain
      description: Each link and its status. Two verified links plus one unproven link is a Medium with a stated precondition, not a Critical.
      value: |
        | # | Link | Status |
        |---|------|--------|
        | 1 |      | Verified on device |
        | 2 |      | Verified on device |
        | 3 |      | **Unproven** — requires … |
    validations: {required: true}
  - type: input
    id: evidence_root
    attributes: {label: Evidence root, description: "Where the tree lives in the engagement folder", placeholder: "findings/F-003/ · logs/D07-014.txt · videos/F-003.mp4 · pocs/F-003/"}
    validations: {required: true}
  - type: input
    id: second_impl
    attributes: {label: Second implementation checked, description: "Name the other module(s) that could provide the same capability and why they do not change the result", placeholder: "LegacyRouter (dead code since 7.9, not registered in the manifest)"}
    validations: {required: true}
  - type: checkboxes
    id: evidence
    attributes:
      label: Evidence checklist (docs/04)
      options:
        - {label: "Video — one continuous take, portrait, under 60 s, under 5 MB, device identity readable (untick only for a code-verified finding; say which environment would prove it below)", required: false}
        - {label: "Ground truth from the legitimate app shown before the attack", required: false}
        - {label: "Negative control in the SAME take as the exploit", required: false}
        - {label: "Raw platform API return values printed, not paraphrased", required: false}
        - {label: "Probe-app source committed under pocs/F-NNN/ (never a built APK)", required: true}
        - {label: "Nothing on screen belongs to a real third party", required: true}
        - {label: "Not an emulator artefact (docs/02 §9); root used for evidence only", required: true}
        - {label: "Any extracted secret had its restriction verified with a recorded probe", required: true}
  - type: textarea
    id: remediation
    attributes: {label: Remediation, description: "Specific to their code, not generic advice."}
    validations: {required: true}
  - type: textarea
    id: limitations
    attributes: {label: Limitations and what was ruled out, description: "Anything the environment could not prove, and which environment would prove it. If any evidence box above is unticked (static-only / code-verified, docs/04 §8), name the environment that would prove it here."}
    validations: {required: true}
