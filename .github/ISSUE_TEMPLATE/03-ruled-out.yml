name: "✅ Ruled out — verified negative result"
description: "Record a surface tested and found clean, with the mechanism that closes it. Negative results are a deliverable."
title: "[RULED OUT] <Dnn or Dnn-NNN> <surface> — <mechanism in five words>"
labels: ["type: ruled-out"]
projects: ["sanehunters/1"]
body:
  - type: markdown
    attributes:
      value: |
        A findings list without a ruled-out register looks like a sample; with one it looks like an audit.
        **A tool's silence is never a negative result.** Only a manifest read, a code read, or a controlled
        experiment with a verified precondition establishes a true negative (rule R4).

  - type: input
    id: engagement
    attributes: {label: Engagement folder, placeholder: BugBountyTarget/Nisho_07092026}
    validations: {required: true}
  - type: input
    id: checklist_ids
    attributes: {label: Checklist item id(s) or whole domain, placeholder: "D07-014, D07-015 (or: D10 — whole domain n/a)"}
    validations: {required: true}
  - type: input
    id: instances
    attributes: {label: Instance id(s) covered, description: "C-/U-/W-/E-NNN rows in inventory/*.csv now tested=true", placeholder: "C-023, C-024"}
  - type: input
    id: surface
    attributes: {label: Surface tested, placeholder: "content://com.client.files openFile()"}
    validations: {required: true}
  - type: dropdown
    id: attacker
    attributes:
      label: Attacker model this rules out
      description: Clean for AM-03 says nothing about AM-05. Record which one.
      options: ["AM-01", "AM-02", "AM-03", "AM-04", "AM-05", "AM-06", "AM-07", "AM-08", "AM-09", "AM-10", "AM-11"]
    validations: {required: true}
  - type: textarea
    id: tried
    attributes: {label: What was tried, description: "Every payload, path and variant — this is the coverage evidence. Point at logs/Dnn-NNN.txt."}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed result, render: shell}
    validations: {required: true}
  - type: textarea
    id: mechanism
    attributes:
      label: The mechanism that closes it (file:line, or the experiment and its verified precondition)
      placeholder: "openFile() calls getCanonicalFile() and asserts startsWith(base) at FileProv.java:61 — traversal is structurally closed, not merely filtered."
    validations: {required: true}
  - type: input
    id: second_impl
    attributes: {label: Second implementation checked, placeholder: "no other provider serves this authority (manifest + dumpsys package providers)"}
    validations: {required: true}
