name: Evidence hygiene

# Blocks the mistakes that would genuinely hurt in a PUBLIC repository: committing a binary, a key, a decompiled
# tree or a secret dump; committing something that looks like a live credential; committing an engagement folder.
# The patterns are the ones in .claude/hooks/_lib.sh (single source: .gitignore, the hooks and this workflow agree).
on: [push, pull_request, workflow_dispatch]

permissions: { contents: read }

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No binaries, keys, decompiled trees, secret dumps or engagement folders
        run: |
          . .claude/hooks/_lib.sh
          bad=$(git ls-files | grep -Ei "$FORBIDDEN_RE|$FORBIDDEN_DIR_RE" | grep -v '/\.gitkeep$' || true)   # _TEMPLATE/decompiled/.gitkeep is a placeholder, not a tree
          if [ -n "$bad" ]; then
            echo "::error::binary or evidence artefacts committed:"; echo "$bad"; exit 1
          fi
          # the methodology never tracks an engagement: only README.md and _TEMPLATE/ live under BugBountyTarget/
          eng=$(git ls-files 'BugBountyTarget/*' | grep -Ev '^BugBountyTarget/(README\.md|_TEMPLATE/)' || true)
          if [ -n "$eng" ]; then
            echo "::error::engagement evidence committed to the public methodology repo (it belongs in the private evidence repo):"; echo "$eng"; exit 1
          fi
          # size check: no shell string is built from a filename (a quote in a name must not execute anything)
          big=$(git ls-files -z | while IFS= read -r -d '' f; do s=$(wc -c <"$f" 2>/dev/null || echo 0); [ "$s" -gt 5242880 ] && echo "$s $f"; done; true)
          if [ -n "$big" ]; then
            echo "::error::files over 5 MB committed:"; echo "$big"; exit 1
          fi
          echo "clean"

      - name: No live-looking credentials
        run: |
          . .claude/hooks/_lib.sh
          # The methodology (docs/, checklist/, cards/, json/, MASTER) legitimately contains these SHAPES as
          # detection patterns. Only templates, tooling, prompts, the harness and the attacker app are scanned.
          hits=$(git ls-files -z 'BugBountyTarget/**' 'templates/**' 'attacker-app/**' 'scripts/**' 'prompts/**' 'loops/**' '.claude/**' '.github/**' \
                 | xargs -0 grep -nE "$CRED_RE" 2>/dev/null | grep -Ev "$CRED_ALLOW_RE" | grep -v '_lib.sh' | cut -d: -f1 | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::possible live credential committed in:"; echo "$hits"; exit 1
          fi
          echo "clean"
