plugins { id 'com.android.application' }
android {
    namespace 'com.sanehunters.probe'
    compileSdk 35
    defaultConfig {
        applicationId "com.sanehunters.probe"
        minSdk 21
        targetSdk 35            // raise to match the victim when testing export defaults
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { }   // intentionally none
